modLoader="kotlinforforge"
loaderVersion="[5,)"
license="${mod_license}"
issueTrackerURL="https://github.com/MarcusGuy1108/ElectricalAge1201/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="The Age Series Team"
logoFile="assets/eln/logo.png"
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="[${kff_version},)"
    ordering="NONE"
    side="BOTH"
