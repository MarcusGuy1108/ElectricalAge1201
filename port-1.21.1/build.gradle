plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath, '--existing', file('build/resources/main/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// The unit tests use Minecraft's math classes (Vec3) but never start the game.
neoForge.addModdingDependenciesTo(sourceSets.test)

// The item model generator checks icons against the processed (renamed) shared assets.
tasks.matching { it.name == 'runData' }.configureEach { dependsOn 'processResources' }

// Textures, models and sounds are shared with the 1.7.10 build in ../src/main/resources instead of being copied.
def legacyAssets = file('../src/main/resources/assets')
def generatedLang = layout.buildDirectory.dir('generated/lang')

// Minecraft reads JSON lang files; convert the 1.7.10 key=value files, keeping their legacy keys.
tasks.register('convertLegacyLang') {
    inputs.dir(new File(legacyAssets, 'eln/lang'))
    inputs.dir('src/main/lang')
    outputs.dir(generatedLang)
    doLast {
        def outDir = generatedLang.get().dir('assets/eln/lang').asFile
        outDir.mkdirs()
        new File(legacyAssets, 'eln/lang').eachFileMatch(~/.*\.lang/) { file ->
            def entries = new LinkedHashMap<String, String>()
            file.eachLine('UTF-8') { line ->
                def split = line.indexOf('=')
                if (line.startsWith('#') || split <= 0) return
                entries[line.substring(0, split)] = line.substring(split + 1)
            }
            def jsonName = file.name.replace('.lang', '.json').toLowerCase()
            // Strings new in the port (such as Jade's config entry) live in src/main/lang, by language.
            def portLang = project.file("src/main/lang/${jsonName}")
            if (portLang.exists()) entries.putAll(new groovy.json.JsonSlurper().parse(portLang, 'UTF-8') as Map)
            def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
            new File(outDir, jsonName).setText(json, 'UTF-8')
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    // The MNA solver's double-double arithmetic: on the dev run classpath, and inside the release jar.
    jarJar(implementation('org.apache.commons:commons-numbers-core')) {
        version {
            strictly '[1.2,2.0)'
            prefer '1.2'
        }
    }
    additionalRuntimeClasspath 'org.apache.commons:commons-numbers-core:1.2'
    // Optional Jade tooltips and JEI recipe pages (mods.eln.compat); both only run in development.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.commons:commons-math3:3.6.1'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${kotlin_version}"
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'convertLegacyLang'
    from(legacyAssets) {
        into 'assets'
        exclude 'eln/lang/**', 'eln/unused-models/**', 'eln/temp/**', '**/*.blend'
        // Resource paths must be [a-z0-9/._-]; Utils.resourcePath applies the same mapping in code.
        eachFile { it.path = it.path.toLowerCase().replaceAll('[^a-z0-9/._-]', '_') }
        // 1.7.10 resolved sound file names against the eln domain; Minecraft now defaults them to minecraft.
        filesMatching('eln/sounds.json') { filter { line -> line.toLowerCase().replaceAll('"name": *"', '"name": "eln:') } }
    }
    from(generatedLang)
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            kff_version: kff_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Ported batches can carry hundreds of API errors; show all of them, not javac's default 100.
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
