plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
kotlin.jvmToolchain(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    // Makes Slot.x/y writable: Eln GUIs place the player inventory slots after the container is built, as 1.7.10 did.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', file('build/resources/main/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// The item model generator checks icons against the processed (renamed) shared assets.
tasks.matching { it.name == 'runData' }.configureEach { dependsOn 'processResources' }

// Textures, models and sounds are shared with the 1.7.10 build in ../src/main/resources instead of being copied.
def legacyAssets = file('../src/main/resources/assets')
def generatedLang = layout.buildDirectory.dir('generated/lang')

// 1.20.1 reads JSON lang files; convert the 1.7.10 key=value files, keeping their legacy keys.
tasks.register('convertLegacyLang') {
    inputs.dir(new File(legacyAssets, 'eln/lang'))
    outputs.dir(generatedLang)
    doLast {
        def outDir = generatedLang.get().dir('assets/eln/lang').asFile
        outDir.mkdirs()
        new File(legacyAssets, 'eln/lang').eachFileMatch(~/.*\.lang/) { file ->
            def entries = new LinkedHashMap<String, String>()
            file.eachLine('UTF-8') { line ->
                def split = line.indexOf('=')
                if (line.startsWith('#') || split <= 0) return
                entries[line.substring(0, split)] = line.substring(split + 1)
            }
            def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
            new File(outDir, file.name.replace('.lang', '.json').toLowerCase()).setText(json, 'UTF-8')
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "thedarkcolour:kotlinforforge:${kff_version}"
    // shortcut: plain libraries are only on the dev run classpath, not inside the mod jar; add jarJar before the first release.
    minecraftLibrary 'org.apache.commons:commons-numbers-core:1.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.commons:commons-math3:3.6.1'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${kotlin_version}"
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'convertLegacyLang'
    from(legacyAssets) {
        into 'assets'
        exclude 'eln/lang/**', 'eln/unused-models/**', 'eln/temp/**', '**/*.blend'
        // 1.20.1 resource paths must be [a-z0-9/._-]; Utils.resourcePath applies the same mapping in code.
        eachFile { it.path = it.path.toLowerCase().replaceAll('[^a-z0-9/._-]', '_') }
        // 1.7.10 resolved sound file names against the eln domain; 1.20.1 defaults them to minecraft.
        filesMatching('eln/sounds.json') { filter { line -> line.toLowerCase().replaceAll('"name": *"', '"name": "eln:') } }
    }
    from(generatedLang)
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            kff_version: kff_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
