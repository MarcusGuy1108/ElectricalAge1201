modLoader="kotlinforforge"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://github.com/MarcusGuy1108/ElectricalAge1201/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="The Age Series Team"
logoFile="assets/eln/logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    mandatory=true
    versionRange="[${kff_version},)"
    ordering="NONE"
    side="BOTH"
